---
layout: page
---

<header class="series-header">
  <h1 class="series-title">{{ page.title }}</h1>
</header>

{{ content }}

<ol class="series-posts">
  {% for post in page.posts %}
  <li class="series-post">
    <span class="series-post-index" aria-hidden="true">{{ forloop.index }}</span>
    <div class="series-post-body">
      <a class="series-post-title" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <p class="series-post-meta">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
      </p>
    </div>
  </li>
  {% endfor %}
</ol>
